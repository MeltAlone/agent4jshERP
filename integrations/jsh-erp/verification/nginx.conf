# 仅在隔离夹具中捕获普通采购订单创建 body；不记录 token、密码或其他 API。
log_format fixture_order escape=json '{"method":"$request_method","path":"$uri","status":$status,"body":"$request_body"}';
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    location / { try_files $uri $uri/ /index.html; }
    location = /jshERP-boot/depotHead/addDepotHeadAndDetail {
        access_log /var/log/nginx/fixture-order.log fixture_order;
        proxy_pass http://erp-backend:9999;
        proxy_set_header Host $host;
    }
    location /jshERP-boot/ {
        proxy_pass http://erp-backend:9999;
        proxy_set_header Host $host;
    }
}
