# 本地开发；上线需使用 TLS、静态构建及固定受控 ERP 上游。
server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $http_host;
    location /assistant/api/v1/ {
        proxy_pass http://host.docker.internal:18000;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_next_upstream off;
    }
    location /assistant/ {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /jshERP-boot/ {
        proxy_pass http://host.docker.internal:19999/jshERP-boot/;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass http://host.docker.internal:18080;
    }
}
