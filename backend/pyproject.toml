[project]
name = "agent4jsherp-backend"
version = "0.1.0"
description = "jshERP 对话助手服务"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
