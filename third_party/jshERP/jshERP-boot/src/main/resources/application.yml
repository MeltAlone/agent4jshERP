# agent4jshERP: use Compose-provided credentials and service names.
server:
  port: 9999
  servlet:
    context-path: /jshERP-boot
    session:
      timeout: 36000
  tomcat:
    basedir: /tmp/tomcat
spring:
  datasource:
    url: jdbc:mysql://erp-mysql:3306/jsh_erp?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
  redis:
    host: erp-redis
    port: 6379
    password: ${SPRING_REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10485760
      max-request-size: 10485760
mybatis-plus:
  mapper-locations: classpath:./mapper_xml/*.xml
manage:
  roleId: 8001
tenant:
  userNumLimit: 20
  tryDayLimit: 3000
plugin:
  runMode: prod
  pluginPath: plugins
  pluginConfigFilePath: pluginConfig
file:
  uploadType: 1
  path: /opt/jshERP/upload
  exportTmp: /opt/jshERP/export
