schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  项目：agent4jshERP，计划开源并持续迭代的 jshERP 企业业务智能助手。
  文档和代码面向外部使用者与贡献者，应可独立理解，不依赖历史对话或个人环境。
  当前阶段：按 add-contextual-erp-assistant 实施；ERP 契约已实测，应用基础已建立，业务能力以任务清单实测状态为准。
  目标是在真实 ERP 场景中提供可用、可靠、可持续维护的助手。
  架构原则与微软官方参考来源见 docs/architecture-principles.md。
  采用 ERP 全局侧边栏与同源 React iframe，结合页面上下文提供服务；实现与验收按 change 任务推进。
  产品方向：统一对话入口，接受自由表达、业务查询、建议、闲聊与多轮任务；
  通过结构化业务卡片编辑草稿、确认操作，并支持查看和恢复任务。

  已选技术方向：FastAPI；React + TypeScript + Vite；shadcn/ui + Tailwind CSS；
  TanStack 工具。架构可参考 full-stack-fastapi-template 的组织方式；
  项目运行和贡献流程不得依赖该参考项目的本机副本。
  jshERP 提供 ERP 业务能力，本项目通过适配层接入，不另建完整 ERP。
  设计采用 PostgreSQL、LangGraph/PostgreSQL checkpointer、ERP token 交换为助手会话；模块化单体与持久化 worker，共用数据库，同源代理接入。

  Agent 方向：参考微软主编排 Agent 与专业子 Agent 的职责划分，按需委派。
  同时参考工作流模式：开放式分析动态协调，确认、审批和写入由显式流程掌握。
  不因参考架构而绑定 Azure、特定框架或模型供应商；简单任务可以直接调用工具。
  页面上下文、任务上下文与业务草稿分别管理，任务状态需要可恢复。
  类型明确的工具连接业务服务；MCP 是否采用根据复用和接入需求决定。
  卡片采用预定义组件与结构化数据，关联服务端草稿和版本。
  业务服务负责权限、字段校验、金额/单位计算、确认版本、幂等执行与审计。
  区分采购意向、采购订单与采购入库；用户确认草稿和企业审批分别建模。
  jshERP 具体 API、单据类型、权限与库存行为需要核实，不能凭名称推断。

  首个候选业务闭环：采购需求 → 商品/库存查询 → 草稿卡片 → 修改 → 确认
  → 创建业务单据 → 返回真实 ERP 结果。范围以对应 change 的规范为准。

rules:
  proposal:
    - 写清业务问题、目标用户、范围与非目标；区分已确认决策、假设和待核实事项。
    - 每个 change 保持可独立验证，避免一次覆盖整个 ERP 或所有 Agent 能力。
  specs:
    - 用可观察行为描述需求，并为关键需求提供 WHEN/THEN 场景。
    - 涉及写操作时覆盖确认版本、重复提交、权限拒绝和结果未知等相关边界。
    - 明确单据类型、状态变化与库存影响；无法核实的行为应记录为待解决问题。
    - 对涉及的能力定义身份隔离、上下文切换、中断恢复、依赖失败和人工介入场景。
  design:
    - 说明模块边界、数据模型、API/事件契约与任务状态，不将方案假设写成现有能力。
    - 解释 Agent 推理、专业 Agent、工具与确定性业务流程各自承担的职责。
    - 说明影响外部使用者的兼容性与迁移，以及新增依赖、配置和第三方代码来源。
    - 明确 Agent 协作契约、权限、调用预算、持久化状态与失败处理，解释所选模式的适用性。
  tasks:
    - 任务应具体、可执行并能关联需求场景，按依赖顺序排列。
    - 纳入与变更风险相称的验证任务；实现和验证完成后再勾选。
    - 涉及功能状态、运行方式或公开接口时，包含必要的使用文档和配置示例更新。
    - 按范围安排真实 ERP 集成与故障恢复验证，记录响应时间及调用成本；测试替身结果应单独标识。

operations:
  apply:
    guidance:
      - 先阅读 change 的规范、设计和任务；发现业务行为变化时同步更新相关规范。
      - 根据明确的需求场景验证结果，不用模型回复文本代替 ERP 执行回执。
  archive:
    guidance:
      - 归档前核对任务完成、验证结果与主规范同步情况。
